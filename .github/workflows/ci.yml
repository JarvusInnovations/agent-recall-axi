name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # check:skill and check:bundle join this list with plans/skill-and-hook.md.

      - name: Smoke test the built bin
        run: |
          set -u
          bin=dist/bin/agent-session-axi.js
          node "$bin" --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          node "$bin" --help | grep -q 'usage: agent-session-axi'
          set +e
          out=$(node "$bin" sessions --project /nonexistent 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q '^code: NO_SESSIONS$'
          if echo "$out" | grep -Eq '^\s+at '; then echo "stack trace leaked"; exit 1; fi
