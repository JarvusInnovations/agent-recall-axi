name: 'Release: Prepare PR'

# Every push to develop opens or refreshes the `Release: vX.Y.Z` PR into main and its bot
# changelog comment (RELEASING.md). Pushing never publishes; merging that PR does.
on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-prepare:

    runs-on: ubuntu-latest
    steps:

    - uses: JarvusInnovations/infra-components@channels/github-actions/release-prepare/latest
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        release-branch: main
        # the same tag track the skill bundle's version stamp reads (scripts/build-cli.ts)
        release-tag-match: 'v[0-9]*'
